<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Pipa — Cozinha Boêmia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      background-image: url("bg.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background-color: #f8d9a7;
      width: 420px;
      max-width: 90%;
      padding: 40px 32px;
      border-radius: 24px;
      text-align: center;
    }

    .dots {
      color: #4da3d9;
      letter-spacing: 4px;
      margin-bottom: 24px;
    }

    .logo img {
      width: 140px;
      margin-bottom: 24px;
    }

    .text {
      color: #4d4d4d;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .button {
      background-color: #b10000;
      color: #fff;
      padding: 14px 20px;
      border-radius: 999px;
      text-decoration: none;
      display: block;
      margin-bottom: 14px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="dots">••••••••••••••••••</div>

    <div class="logo">
      <img src="logo.png" alt="Pipa Cozinha Boêmia">
    </div>

    <div class="text">
      Cozinha autoral, bebida gelada e chopp artesanal num cantinho
      intimista e charmoso no bairro Santo Antônio, em BH.
      Vem pro Pipa!
    </div>

    <!-- BOTÃO INSTAGRAM -->
    <a
      class="button"
      href="https://www.instagram.com/pipacozinha"
      target="_blank"
      rel="noopener"
    >
      Visite nosso Instagram
    </a>

    <!-- BOTÃO COMO CHEGAR -->
    <a
      class="button"
      href="https://maps.app.goo.gl/jYookDTQckdiQ75KA"
      target="_blank"
      rel="noopener"
    >
      Como chegar
    </a>

  </div>

</body>
</html>
